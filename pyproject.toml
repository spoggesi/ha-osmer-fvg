[tool.pytest.ini_options]
testpaths = [
    "tests",
]
pythonpath = [
    ".",
]
asyncio_mode = "auto"

addopts = [
    "--strict-markers",
]

filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
ignore = [
    "EXE002",
]